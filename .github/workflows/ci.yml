name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup PHP for executable bootstrap tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run builder tests
        run: npm test

      - name: Package and verify artifacts
        run: npm run verify:artifacts

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint WordPress PHP
        run: php scripts/lint-php.php

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wp_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: wp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wp_test -d wp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WP_STARTER_TEST_PG_URL: postgres://wp_test:test-only-password@127.0.0.1:5432/wp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: node --test apps/server/tests/postgres.test.mjs

  desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm ci
      - name: Package Windows desktop app
        run: npm run package:desktop
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wp-starter-desktop-windows
          path: artifacts/desktop/*
