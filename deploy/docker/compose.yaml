name: wp-starter
services:
  database:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: wp_starter
      POSTGRES_DB: wp_starter
      POSTGRES_PASSWORD: ${WP_STARTER_DB_PASSWORD:?Set WP_STARTER_DB_PASSWORD}
    volumes:
      - /var/lib/wp-starter-postgres:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wp_starter -d wp_starter"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    logging:
      options: {max-size: 10m, max-file: "3"}

  app:
    image: wp-starter-server:${WP_STARTER_RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    depends_on:
      database: {condition: service_healthy}
    env_file:
      - /etc/wp-starter/server.env
    environment:
      WP_STARTER_SERVER_HOST: 0.0.0.0
      WP_STARTER_SERVER_PORT: "47900"
      WP_STARTER_DATA_DIR: /var/lib/wp-starter
      WP_STARTER_TRUST_PROXY: "true"
      WP_STARTER_DATABASE_URL: postgres://wp_starter:${WP_STARTER_DB_PASSWORD}@database:5432/wp_starter
    volumes:
      - /var/lib/wp-starter:/var/lib/wp-starter
    networks: [frontend, storage]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:47900/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      options: {max-size: 10m, max-file: "3"}

  proxy:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    ports:
      - ${WP_STARTER_LAN_IP:-127.0.0.1}:${WP_STARTER_LAN_PORT:-47901}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    mem_limit: 128m
    logging:
      options: {max-size: 10m, max-file: "3"}

networks:
  frontend:
  storage:
    internal: true
