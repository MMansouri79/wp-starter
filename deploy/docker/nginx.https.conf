server {
    listen 80;
    server_name _;
    # Preserve the private monitoring endpoint after enabling secure cookies.
    location = /api/health {
        proxy_pass http://app:47900;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 302 https://wp.mediasanat.ir:2053$request_uri; }
}

server {
    listen 443 ssl;
    server_name wp.mediasanat.ir;
    ssl_certificate /etc/letsencrypt/live/wp.mediasanat.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wp.mediasanat.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WPStarterTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1100m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location / { proxy_pass http://app:47900; }
}
