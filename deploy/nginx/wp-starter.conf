# nginx server block for the WP Starter shared builder.
#
# Install:
#   sudo cp deploy/nginx/wp-starter.conf /etc/nginx/sites-available/wp-starter.conf
#   sudo ln -s /etc/nginx/sites-available/wp-starter.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace builder.example.com with your own subdomain, then obtain the
# certificate with certbot (see docs/SERVER-DEPLOYMENT.md).

upstream wp_starter_server {
    server 127.0.0.1:47900;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name builder.example.com;

    # Let's Encrypt HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name builder.example.com;

    ssl_certificate     /etc/letsencrypt/live/builder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/builder.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Must stay above WP_STARTER_MAX_UPLOAD_BYTES (default 1024 MiB) or nginx
    # rejects large package archives before Node ever sees them.
    client_max_body_size 1100m;
    client_body_timeout 300s;

    # Builds answer immediately with a job id and the client polls, so the read
    # timeout only has to cover a normal API round trip.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Stream uploads straight through instead of buffering whole ZIPs on disk.
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Only meaningful together with WP_STARTER_TRUST_PROXY=true.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://wp_starter_server;
    }
}
